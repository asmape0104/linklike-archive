const key='linklife-cast-review-v1';
let state=JSON.parse(localStorage.getItem(key)||'{"index":0,"answers":{}}');
const el=id=>document.getElementById(id);
function render(){const r=rows[state.index];el('image').src=r.image;el('title').textContent=r.section+' '+r.title;el('progress').textContent=(state.index+1)+' / '+rows.length;el('cast').replaceChildren(...(state.answers[r.id]?.characters||r.characters).map(n=>{const li=document.createElement('li');li.textContent=n;return li}));el('names').value=(state.answers[r.id]?.characters||r.characters).join('\n');el('edit').hidden=true;el('results').value=JSON.stringify(state.answers,null,2);el('prev').disabled=state.index===0}
function advance(characters,answer){const r=rows[state.index];state.answers[r.id]={answer,characters};if(state.index<rows.length-1)state.index++;else el('status').textContent='全話の確認が終わりました。チャットに「確認完了」と送ってください。';localStorage.setItem(key,JSON.stringify(state));render()}
el('yes').onclick=()=>advance(el('names').value.split('\n').filter(Boolean),'yes');
el('no').onclick=()=>{el('edit').hidden=false;el('names').focus()};
el('save').onclick=()=>{const names=[...new Set(el('names').value.split('\n').map(n=>n.trim()).filter(Boolean))];if(names.length)advance(names,'corrected')};
el('prev').onclick=()=>{if(state.index>0)state.index--;localStorage.setItem(key,JSON.stringify(state));render()};
render();
